name: "dev"
display_name: "개발 프로세스 단축 명령"
description: "dev-req 스킬로 위임하는 단축 명령 디스패처"
category: "productivity"
version: "2.1.0"
author: "MOAI Team"

# 스킬 타입
type: "dispatcher"

# 스크립트 정의 (디스패처만)
scripts:
  - name: "dispatch"
    file: "dispatch.py"
    description: "명령어 디스패처"
    parameters:
      - name: "command"
        type: "string"
        required: false
        description: "실행할 명령 (init, req, status, help)"

# 단축 명령어 매핑
shortcuts:
  # 요구사항 관리 (dev-req)
  init: "dev-req:init"
  req: "dev-req:create"
  status: "dev-req:progress-report"

# 의존 스킬
dependencies:
  - "dev-req"

# 사용 예시
examples:
  - command: "/dev init"
    description: "요구사항 관리 구조 초기화"

  - command: "/dev req 사용자인증기능"
    description: "새 요구사항 명세서 생성"

  - command: "/dev status"
    description: "진행 상황 리포트"

  - command: "/dev help"
    description: "도움말 표시"
