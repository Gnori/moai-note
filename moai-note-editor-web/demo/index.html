<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>moai-note 에디터 데모</title>
<style>
  /*
   * 호스트의 전역 리셋을 일부러 넣는다.
   * SeedAI 챗봇 위젯 CSS 에 이런 규칙이 있어, Shadow DOM 격리가 실제로
   * 동작하는지 여기서 확인해야 한다.
   */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif;
    background: #f3f4f6;
    padding: 24px;
  }
  .panel {
    max-width: 900px;
    margin: 0 auto 20px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.hint { color: #6b7280; font-size: 13px; margin-bottom: 16px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 12px; margin-bottom: 16px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
  }
  .controls input {
    padding: 6px 10px; font: inherit; font-size: 13px;
    border: 1px solid #d1d5db; border-radius: 6px;
  }
  .controls input[name=base] { width: 220px; }
  .controls input[name=doc]  { width: 300px; }
  .controls button {
    padding: 6px 12px; font: inherit; font-size: 13px;
    background: #5e35b1; color: #fff; border: 0; border-radius: 6px; cursor: pointer;
  }
  .controls button.ghost { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  #log {
    max-width: 900px; margin: 16px auto 0; padding: 10px 12px;
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.6;
    background: #111827; color: #d1d5db; border-radius: 8px;
    max-height: 200px; overflow-y: auto; white-space: pre-wrap;
  }
  body.dark { background: #111318; color: #e6e8eb; }
</style>
</head>
<body>

<div class="panel">
  <h1>moai-note 에디터 데모</h1>
  <p class="hint">
    호스트 페이지에 <code>* { margin:0; padding:0 }</code> 전역 리셋이 걸려 있습니다 —
    Shadow DOM 격리가 동작하면 에디터 여백이 정상으로 보입니다.
  </p>

  <div class="controls">
    <input name="base" placeholder="API 주소" value="http://localhost:7100">
    <input name="doc" placeholder="문서 ID">
    <input name="token" placeholder="액세스 토큰" style="width:260px">
    <button id="mount">마운트</button>
    <button id="unmount" class="ghost">해제</button>
    <button id="stress" class="ghost">마운트/해제 20회</button>
    <button id="theme" class="ghost">다크 전환</button>
  </div>
</div>

<div class="panel" id="slot"></div>
<div id="log"></div>

<script src="/dist/embed.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const logEl = $('#log');
let instance = null;

function log(msg) {
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

function countNodes() {
  return document.querySelectorAll('*').length;
}

$('#mount').addEventListener('click', () => {
  if (instance) { log('이미 마운트되어 있습니다. 먼저 해제하세요.'); return; }
  try {
    instance = MoaiNote.mount('#slot', {
      apiBase: $('input[name=base]').value.trim(),
      documentId: $('input[name=doc]').value.trim(),
      token: $('input[name=token]').value.trim(),
      mode: 'edit',
      theme: 'auto',
      onSave: (doc) => log(`저장됨 → revision ${doc.revision}`),
      onError: (err) => log(`오류: ${err && err.message ? err.message : err}`),
    });
    log('마운트 완료 (MoaiNote v' + MoaiNote.version + ')');
  } catch (e) {
    log('마운트 실패: ' + e.message);
  }
});

$('#unmount').addEventListener('click', () => {
  if (!instance) { log('마운트된 인스턴스가 없습니다.'); return; }
  instance.destroy();
  instance = null;
  log('해제 완료');
});

// 누수 확인 — 20회 반복 후 DOM 노드 수가 원래대로 돌아와야 한다
$('#stress').addEventListener('click', () => {
  if (instance) { instance.destroy(); instance = null; }
  const before = countNodes();
  const opts = {
    apiBase: $('input[name=base]').value.trim(),
    documentId: $('input[name=doc]').value.trim(),
    token: $('input[name=token]').value.trim(),
    mode: 'edit',
  };
  for (let i = 0; i < 20; i++) {
    const inst = MoaiNote.mount('#slot', opts);
    inst.destroy();
  }
  const after = countNodes();
  log(`마운트/해제 20회 — DOM 노드 ${before} → ${after} ${before === after ? '✅ 누수 없음' : '❌ 잔존 ' + (after - before)}`);
});

$('#theme').addEventListener('click', () => {
  document.body.classList.toggle('dark');
  log('호스트 테마 전환 — 다시 마운트하면 auto 판정이 반영됩니다.');
});

log('준비되었습니다. API를 띄우고 문서 ID·토큰을 넣은 뒤 마운트하세요.');
</script>
</body>
</html>
